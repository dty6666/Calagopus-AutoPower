# CalagopusAutoPower configuration
calagopus.url=https://mcpanel.keluarganaga.one
calagopus.server-uuid=dceacce3-a89b-4156-8883-9f9417368642
calagopus.api-key-env=CALAGOPUS_API_KEY

# Velocity registered-server name from velocity.toml
backend-server=paper

# Paper status endpoint through FRP on the VPS
status-host=127.0.0.1
status-port=25066
status-timeout-millis=3000

# Chunky status bridge through FRP on the VPS
chunky-status-host=127.0.0.1
chunky-status-port=28199
chunky-status-timeout-millis=3000

# How often the plugin checks whether players are online.
check-interval-seconds=5

# Start/ping settings
startup-timeout-seconds=120
startup-poll-seconds=2

# Idle shutdown
idle-minutes=10
save-wait-seconds=5

# If true, issue save-all before stopping.
save-before-stop=true

# Message shown while Paper is starting.
startup-message=Paper is starting. Please wait...

# Web control panel
web-enabled=true
web-bind=127.0.0.1
web-port=18182
web-auth-token-env=CALAGOPUS_AUTOPOWER_WEB_TOKEN
