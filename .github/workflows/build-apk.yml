name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin
        id: kotlin-build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --stacktrace --info 2>&1 | tee kotlin-build.log

      - name: Show Kotlin compiler errors
        if: always()
        run: |
          echo "========================================"
          echo "       KOTLIN COMPILER OUTPUT"
          echo "========================================"

          grep -E "^e:|^w:|MainActivity.kt|ApiClient.kt|Compilation error" kotlin-build.log || true

          echo "========================================"
          echo "       END KOTLIN OUTPUT"
          echo "========================================"

      - name: Upload Kotlin build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-build-log
          path: kotlin-build.log
          if-no-files-found: warn

      - name: Stop if Kotlin compilation failed
        if: steps.kotlin-build.outcome == 'failure'
        run: |
          echo "Kotlin compilation failed."
          exit 1

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calagopus-auto-power-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
