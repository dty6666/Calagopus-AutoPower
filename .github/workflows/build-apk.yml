name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Show available Android SDK packages
        run: |
          sdkmanager --list | grep -E "platforms;android-37|build-tools;37" || true

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"

      - name: Verify Android SDK
        run: |
          echo "Installed SDK packages:"
          sdkmanager --list_installed | grep -E "platforms;android-37|build-tools;37|platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Clean
        run: |
          gradle clean --console=plain

      - name: Build Debug APK
        run: |
          gradle assembleDebug --console=plain --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calagopus-auto-power-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
