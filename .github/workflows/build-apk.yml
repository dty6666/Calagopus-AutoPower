name: Inspect Calagopus ZIP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q CalagopusAutoPower.zip -d extracted

      - name: Show project structure
        run: |
          echo "===== FILES ====="
          find extracted -type f | sort

          echo
          echo "===== GRADLE FILES ====="
          find extracted -type f \( \
            -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle.properties" \
            -o -name "gradlew" \
          \) -print

          echo
          echo "===== ANDROID FILES ====="
          find extracted -type f \( \
            -name "AndroidManifest.xml" \
            -o -name "*.kt" \
            -o -name "*.java" \
          \) | sort
