name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -eux

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show environment
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"
          gradle --version

          echo ""
          echo "========================================"
          echo "ANDROID"
          echo "========================================"
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0" || true

      - name: Clean
        run: |
          set -eux
          gradle clean --console=plain

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "STARTING ANDROID BUILD"
          echo "========================================"

          gradle assembleDebug \
            --console=plain \
            --stacktrace \
            --info \
            2>&1 | tee android-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "GRADLE EXIT CODE: $EXIT_CODE"
          echo "========================================"

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Extract useful failure information
        if: always()
        run: |
          echo "# Android Build Diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Gradle exit code" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Error / warning lines" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          grep -iE \
            "error:|errors|exception|failed|failure|unable|could not|cannot|problem|caused by" \
            android-build.log \
            | tail -200 \
            >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Last 200 lines" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          tail -200 android-build.log >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Fail workflow if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "Android build failed."
          echo "Gradle exit code: ${{ steps.build.outputs.exit_code }}"
          exit 1

      - name: Verify APK
        run: |
          set -eux

          echo "APK output:"
          find app/build/outputs -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calagopus-auto-power-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
