name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin and capture ALL output
        run: |
          set +e

          gradle :app:compileDebugKotlin --stacktrace --debug > kotlin-build.log 2>&1

          RESULT=$?

          echo ""
          echo "========================================"
          echo "       COMPLETE KOTLIN BUILD LOG"
          echo "========================================"

          cat kotlin-build.log

          echo "========================================"
          echo "       END KOTLIN BUILD LOG"
          echo "========================================"

          exit $RESULT

      - name: Upload Kotlin build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-build-log
          path: kotlin-build.log
          if-no-files-found: error

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calagopus-auto-power-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
