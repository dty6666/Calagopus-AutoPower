name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin
        id: compile
        continue-on-error: true
        run: |
          gradle :app:compileDebugKotlin --console=plain 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Put compiler errors in Summary
        if: always()
        run: |
          echo "# 🔴 Kotlin Build Diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          grep -E \
            "e: |error:|MainActivity\.kt:|ApiClient\.kt:|Unresolved reference|Type mismatch|Cannot access|Expecting" \
            build.log \
            | head -100 \
            >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if Kotlin compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo "Kotlin compilation failed."
          exit 1

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calagopus-auto-power-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
